<body>

<button id="volume-control-btn" onclick="toggleSound()">🔇 Wellcome</button>

<div id="player" ></div> 
<script type="text/javascript">
		function getData(e){e=e.replace(/[\[]/,"[").replace(/[\]]/,"]");
        var a=new RegExp("[?&]"+e+"=([^&#]*)").exec(location.search);return null===a?"":decodeURIComponent(a[1].replace(/\+/g," "))}
		var playerInstance = jwplayer("player");
		playerInstance.setup({
		    title : "CHOICES MOUSIC",
	      description: "MUSIC CHANNEL",
			file: "https://rtmp.streams.ovh:1936/barazarelax/barazarelax/playlist.m3u8",
			type: "hls",
			width: "100%",
			height: "100%",
			stretching: "fill",   /*  */
			autostart: true,
			mute: true,           /*  */
			controls: false,      /*  */
			cast:{},
		});		
		jwplayer("player").on("play", function(e){jwplayer("player").setCurrentAudioTrack(getData("lang"));jwplayer("player").setCurrentQuality(3)});
		
		function toggleSound() {
			const btn = document.getElementById('volume-control-btn');
			if (playerInstance.getMute()) {
				playerInstance.setMute(false);
				btn.innerHTML = "🔊 ΣΙΓΑΣΗ";
			} else {
				playerInstance.setMute(true);
				btn.innerHTML = "🔇 ΗΧΟΣ";
			}
		}
	</script>

<script>function toggleFullscreen() {
  let elem = document.querySelector("iframe");

  if (!document.fullscreenElement) {
    elem.requestFullscreen().catch((err) => {
      alert(`Error attempting to enable fullscreen mode: ${err.message} (${err.name})`);
    });
  } else {
    document.exitFullscreen();
  }
}</script>

<!-- -->
<script type="text/javascript">
  // Απενεργοποίηση δεξιού κλικ
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // 
  document.addEventListener('keydown', function(e) {
    // F12
    if (e.keyCode == 123) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) {
      e.preventDefault();
      return false;
    }
    //
    if (e.ctrlKey && e.keyCode == 85) {
      e.preventDefault();
      return false;
    }
    // 
    if (e.ctrlKey && e.keyCode == 83) {
      e.preventDefault();
      return false;
    }
  });
</script>
